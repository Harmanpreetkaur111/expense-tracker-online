<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expense Tracker</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main>
  <header>
    <div>
      <h1>Expense tracker</h1>
      <p class="sub">Log what you spend and see where it goes.</p>
    </div>
    <div class="hdr-right"><span class="sub" id="who"></span><button class="ghost" id="logoutBtn" type="button" hidden>Log out</button><button class="ghost" id="themeBtn" type="button">Toggle theme</button></div>
  </header>

  <!-- LOGIN / SIGN UP (shown when not logged in) -->
  <section class="panel auth" id="auth" hidden>
    <h2 id="authTitle">Log in</h2>
    <label for="username">Username</label>
    <input id="username" type="text" autocomplete="username" maxlength="30">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <p class="error" id="authError" role="alert"></p>
    <button class="primary" id="authBtn" type="button">Log in</button>
    <button class="ghost linkbtn" id="switchMode" type="button">New here? Create an account</button>
  </section>

  <!-- THE APP (shown when logged in) -->
  <div id="app" hidden>

  <section class="totals" aria-label="Totals">
    <div class="total main"><span>Total spent</span><strong id="totalAll">₹0</strong></div>
    <div class="total"><span>This month</span><strong id="totalMonth">₹0</strong></div>
    <div class="total"><span>Entries</span><strong id="count">0</strong></div>
  </section>

  <div class="grid">
    <!-- ADD FORM -->
    <section class="panel">
      <h2 id="formTitle">Add an expense</h2>
      <!-- No <form> tag: we handle the button click in JavaScript -->
      <label for="desc">Description</label>
      <input id="desc" type="text" maxlength="60" placeholder="Lunch, bus pass, notebook…">
      <label for="amount">Amount (₹)</label>
      <input id="amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="250">
      <label for="category">Category</label>
      <select id="category"></select>
      <label for="date">Date</label>
      <input id="date" type="date">
      <p class="error" id="error" role="alert"></p>
      <button class="primary" id="addBtn" type="button">Add expense</button>
      <button class="ghost cancel" id="cancelBtn" type="button" hidden>Cancel edit</button>
    </section>

    <!-- LIST + BREAKDOWN -->
    <section class="panel">
      <div class="toolbar">
        <h2 style="margin:0">Expenses</h2>
        <span class="spacer"></span>
        <button class="ghost" id="clearBtn" type="button">Clear all</button>
      </div>
      <div class="filters">
        <input class="wide" id="search" type="search" placeholder="Search by description…" aria-label="Search">
        <select id="filter" aria-label="Filter by category"></select>
        <button class="ghost reset" id="resetBtn" type="button">Reset filters</button>
        <label>From<input id="from" type="date"></label>
        <label>To<input id="to" type="date"></label>
      </div>
      <p class="sub" id="showing"></p>
      <ul id="list"></ul>
      <div class="bars" id="bars"></div>
    </section>
  </div>
  </div>
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
